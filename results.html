<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты голосования — Лучший доклад</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --emerald: #0E7A5F;
            --emerald-dark: #0A5A46;
            --emerald-accent: #14B88A;
            --emerald-light: #E6F4EF;
            --emerald-border: #B9DED2;
            --text-dark: #0A2E24;
            --text-muted: #7A968C;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: var(--text-dark);
            min-height: 100vh;
            padding: 14px 24px 18px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Логотип слева */
        .logo-bar {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        .logo-bar img {
        max-height: 104px;   /* было 52px */
        max-width: 440px;    /* было 220px — тоже удвоил, чтобы не сжался по ширине */
        object-fit: contain;
       }

        header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 4px solid var(--emerald);
            padding-bottom: 10px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }
        h1 {
            font-size: 30px;
            font-weight: 800;
            color: var(--emerald);
            letter-spacing: 0.4px;
            line-height: 1.1;
        }
        .subtitle {
            font-size: 15px;
            color: var(--emerald-dark);
            font-weight: 500;
            margin-top: 3px;
        }
        .total-badge {
            font-size: 17px;
            color: var(--emerald-dark);
            font-weight: 600;
            background: var(--emerald-light);
            padding: 7px 16px;
            border-radius: 22px;
            white-space: nowrap;
        }

        /* Победитель */
        .winner-block {
            display: flex;
            align-items: center;
            gap: 20px;
            background: linear-gradient(135deg, #F2FAF7 0%, #E0F2EA 100%);
            border: 3px solid var(--emerald);
            border-radius: 16px;
            padding: 16px 26px;
            margin-bottom: 16px;
            box-shadow: 0 6px 20px rgba(14, 122, 95, 0.15);
            flex-shrink: 0;
        }
        .cup {
            font-size: 54px;
            line-height: 1;
            filter: drop-shadow(0 4px 8px rgba(14, 122, 95, 0.3));
        }
        .winner-info { flex: 1; }
        .winner-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--emerald);
            font-weight: 700;
            margin-bottom: 2px;
        }
        .winner-code {
            font-size: 44px;
            font-weight: 900;
            color: var(--emerald);
            line-height: 1;
            margin-bottom: 4px;
        }
        .winner-stats {
            font-size: 17px;
            color: var(--emerald-dark);
            font-weight: 600;
        }
        .winner-percent {
            font-size: 36px;
            font-weight: 900;
            color: var(--emerald);
            margin-left: auto;
            text-align: right;
        }
        .winner-percent small {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--emerald-dark);
            letter-spacing: 0.5px;
        }

        /* Рейтинг в 3 колонки */
        .ranking {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px 18px;
            flex: 1;
            align-content: start;
        }
        .rank-row {
            display: grid;
            grid-template-columns: 34px 62px 1fr 78px;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            background: var(--emerald-light);
            border-radius: 8px;
            border-left: 5px solid var(--emerald-border);
            min-height: 40px;
        }
        .rank-row.top3 {
            border-left-color: var(--emerald);
            background: #F2FAF7;
        }
        .rank-row.winner-row {
            border-left-color: var(--emerald);
            background: #E0F2EA;
        }
        .rank-num {
            font-size: 18px;
            font-weight: 900;
            color: var(--emerald-border);
            text-align: center;
        }
        .top3 .rank-num { color: var(--emerald); }
        .rank-code {
            font-size: 15px;
            font-weight: 800;
            color: #000;
            white-space: nowrap;
        }
        .winner-row .rank-code { color: var(--emerald); }
        .rank-bar-wrap {
            height: 14px;
            background: #D8E8E2;
            border-radius: 7px;
            overflow: hidden;
        }
        .rank-bar {
            height: 100%;
            border-radius: 7px;
            background: var(--emerald-dark);
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
            width: 0%;
        }
        .top3 .rank-bar { background: var(--emerald); }
        .rank-values {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            line-height: 1.1;
        }
        .rank-percent {
            font-size: 15px;
            font-weight: 800;
            color: #000;
        }
        .top3 .rank-percent { color: var(--emerald); }
        .rank-count {
            font-size: 10px;
            color: var(--text-muted);
            font-weight: 500;
            white-space: nowrap;
        }

        #loading {
            text-align: center;
            font-size: 20px;
            color: var(--text-muted);
            padding: 60px 0;
        }
        .error-box {
            background: #F2FAF7;
            border: 2px solid var(--emerald);
            border-radius: 12px;
            padding: 20px;
            color: var(--emerald);
            font-size: 15px;
            margin-top: 16px;
        }
        .error-box code {
            background: #E0F2EA;
            padding: 2px 8px;
            border-radius: 4px;
            font-family: monospace;
        }
        .refresh-hint {
            margin-top: 10px;
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            flex-shrink: 0;
        }

        @media (max-width: 1100px) {
            body { padding: 12px; }
            h1 { font-size: 24px; }
            .cup { font-size: 42px; }
            .winner-code { font-size: 34px; }
            .winner-percent { font-size: 28px; }
            .rank-row {
                grid-template-columns: 28px 54px 1fr 66px;
                padding: 6px 8px;
                min-height: 36px;
            }
            .rank-num { font-size: 15px; }
            .rank-code { font-size: 13px; }
            .rank-percent { font-size: 13px; }
            .rank-count { font-size: 9px; }
        }

        @media (max-width: 760px) {
            body { overflow: auto; }
            .ranking { grid-template-columns: repeat(2, 1fr); }
            .winner-block { flex-wrap: wrap; gap: 12px; }
            .winner-percent { margin-left: 0; text-align: left; }
        }
    </style>
</head>
<body>

    <div class="logo-bar">
        <img src="logo.png" alt="Логотип">
    </div>

    <header>
        <div>
            <h1>Лучший доклад</h1>
            <div class="subtitle">Итоги голосования в зале</div>
        </div>
        <div class="total-badge" id="totalBadge">Всего голосов: —</div>
    </header>

    <div id="loading">Загрузка результатов…</div>
    <div id="content" style="display:none; flex-direction:column; flex:1; min-height:0;"></div>

    <script>
        const CODES = [
            "U-01","U-02","U-03","U-04","U-05","U-06","U-07",
            "U-08","U-09","U-10","U-11","U-12","U-13",
            "U-14","U-15","U-16","U-17","U-18","U-19"
        ];

        const NAMESPACE = "project-test-v1";

        async function loadVotes() {
            const promises = CODES.map(async (code) => {
                try {
                    const res = await fetch(
                        `https://abacus.jasoncameron.dev/get/${NAMESPACE}/${encodeURIComponent(code)}?_=${Date.now()}`
                    );
                    if (!res.ok) return { code, count: 0 };
                    const data = await res.json();
                    return { code, count: Number(data.value) || 0 };
                } catch {
                    return { code, count: 0 };
                }
            });
            const rows = await Promise.all(promises);
            const result = {};
            rows.forEach(r => { result[r.code] = r.count; });
            return result;
        }

        function render(votes) {
            const items = CODES.map(code => ({
                code,
                count: Number(votes[code]) || 0
            }));

            const total = items.reduce((s, i) => s + i.count, 0);
            items.forEach(i => {
                i.percent = total > 0 ? (i.count / total * 100) : 0;
            });

            items.sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                return a.code.localeCompare(b.code);
            });

            const winner = total > 0 ? items[0] : null;

            const content = document.getElementById('content');
            document.getElementById('loading').style.display = 'none';
            content.style.display = 'flex';

            let html = '';

            if (winner) {
                html += `
                    <div class="winner-block">
                        <div class="cup">🏆</div>
                        <div class="winner-info">
                            <div class="winner-label">Победитель</div>
                            <div class="winner-code">${winner.code}</div>
                            <div class="winner-stats">${winner.count} голосов из ${total}</div>
                        </div>
                        <div class="winner-percent">
                            ${winner.percent.toFixed(1)}%
                            <small>от всех голосов</small>
                        </div>
                    </div>
                `;
            } else {
                html += `
                    <div class="error-box">
                        Пока нет ни одного голоса. Откройте <code>vote.html</code> и проголосуйте.
                    </div>
                `;
            }

            html += '<div class="ranking">';
            items.forEach((item, idx) => {
                const rank = idx + 1;
                const isWinner = winner && item.code === winner.code;
                const isTop3 = rank <= 3;
                const rowClass = isWinner ? 'rank-row winner-row'
                               : isTop3   ? 'rank-row top3'
                                          : 'rank-row';

                html += `
                    <div class="${rowClass}">
                        <div class="rank-num">${rank}</div>
                        <div class="rank-code">${item.code}</div>
                        <div class="rank-bar-wrap">
                            <div class="rank-bar" style="width:${item.percent}%"></div>
                        </div>
                        <div class="rank-values">
                            <span class="rank-percent">${item.percent.toFixed(1)}%</span>
                            <span class="rank-count">${item.count} г.</span>
                        </div>
                    </div>
                `;
            });
            html += '</div>';
            html += '<div class="refresh-hint">Обновите страницу (F5), чтобы увидеть свежие данные</div>';

            content.innerHTML = html;
            document.getElementById('totalBadge').textContent = `Всего голосов: ${total}`;
        }

        loadVotes().then(render).catch(e => {
            console.error(e);
            document.getElementById('loading').textContent = 'Ошибка загрузки данных: ' + e.message;
        });
    </script>
</body>
</html>
