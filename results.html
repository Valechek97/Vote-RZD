<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Результаты голосования — Лучший проект</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --emerald: #0E7A5F; --emerald-dark: #0A5A46; --emerald-accent: #14B88A;
            --emerald-light: #E6F4EF; --emerald-border: #B9DED2;
            --text-dark: #0A2E24; --text-muted: #7A968C;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff; color: var(--text-dark);
            min-height: 100vh; padding: 14px 24px 18px;
            display: flex; flex-direction: column; overflow: hidden;
        }
        header { display: flex; align-items: center; gap: 24px; border-bottom: 4px solid var(--emerald); padding-bottom: 12px; margin-bottom: 14px; flex-shrink: 0; }
        .logo-bar { flex-shrink: 0; display: flex; align-items: center; }
        .logo-bar img { max-height: 80px; max-width: 260px; object-fit: contain; }
        .title-block { flex: 1; text-align: center; min-width: 0; }
        h1 { font-size: 30px; font-weight: 800; color: var(--emerald); letter-spacing: 0.4px; line-height: 1.1; }
        .subtitle { font-size: 15px; color: var(--emerald-dark); font-weight: 500; margin-top: 3px; }
        
        .header-actions { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
        .total-badge { font-size: 17px; color: var(--emerald-dark); font-weight: 600; background: var(--emerald-light); padding: 8px 18px; border-radius: 22px; white-space: nowrap; }
        .reset-btn {
            padding: 8px 16px; background: #fff; color: #0E7A5F;
            border: 2px solid #0E7A5F; border-radius: 22px; font-size: 14px;
            font-weight: 600; cursor: pointer; font-family: inherit;
            white-space: nowrap; transition: all 0.2s;
        }
        .reset-btn:hover { background: var(--emerald-light); }
        .reset-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .winner-block { display: flex; align-items: center; gap: 20px; background: linear-gradient(135deg, #F2FAF7 0%, #E0F2EA 100%); border: 3px solid var(--emerald); border-radius: 16px; padding: 16px 26px; margin-bottom: 16px; box-shadow: 0 6px 20px rgba(14, 122, 95, 0.15); flex-shrink: 0; }
        .cup { font-size: 54px; line-height: 1; filter: drop-shadow(0 4px 8px rgba(14, 122, 95, 0.3)); flex-shrink: 0; }
        .winner-info { flex: 1; min-width: 0; }
        .winner-label { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; color: var(--emerald); font-weight: 700; margin-bottom: 4px; }
        .winner-codes { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-bottom: 6px; }
        .winner-code { font-size: 40px; font-weight: 900; color: var(--emerald); line-height: 1; }
        .winner-code .plus { font-size: 22px; font-weight: 700; color: var(--emerald-dark); margin-left: 10px; vertical-align: middle; }
        .winner-stats { font-size: 17px; color: var(--emerald-dark); font-weight: 600; }
        .winner-percent { font-size: 36px; font-weight: 900; color: var(--emerald); margin-left: auto; text-align: right; flex-shrink: 0; }
        .winner-percent small { display: block; font-size: 13px; font-weight: 600; color: var(--emerald-dark); letter-spacing: 0.5px; }

        .ranking { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px 18px; flex: 1; align-content: start; }
        .rank-row { display: grid; grid-template-columns: 34px 62px 1fr 78px; align-items: center; gap: 8px; padding: 7px 10px; background: var(--emerald-light); border-radius: 8px; border-left: 5px solid var(--emerald-border); min-height: 40px; }
        .rank-row.top3 { border-left-color: var(--emerald); background: #F2FAF7; }
        .rank-row.winner-row { border-left-color: var(--emerald); background: #E0F2EA; }
        .rank-num { font-size: 18px; font-weight: 900; color: var(--emerald-border); text-align: center; }
        .top3 .rank-num { color: var(--emerald); }
        .rank-code { font-size: 15px; font-weight: 800; color: #000; white-space: nowrap; }
        .winner-row .rank-code { color: var(--emerald); }
        .rank-bar-wrap { height: 14px; background: #D8E8E2; border-radius: 7px; overflow: hidden; }
        .rank-bar { height: 100%; border-radius: 7px; background: var(--emerald-dark); transition: width 1s cubic-bezier(0.22, 1, 0.36, 1); width: 0%; }
        .top3 .rank-bar { background: var(--emerald); }
        .rank-values { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
        .rank-percent { font-size: 15px; font-weight: 800; color: #000; }
        .top3 .rank-percent { color: var(--emerald); }
        .rank-count { font-size: 10px; color: var(--text-muted); font-weight: 500; white-space: nowrap; }

        #loading { text-align: center; font-size: 20px; color: var(--text-muted); padding: 60px 0; }
        .error-box { background: #F2FAF7; border: 2px solid var(--emerald); border-radius: 12px; padding: 20px; color: var(--emerald); font-size: 15px; margin-top: 16px; }
        .error-box button { margin-top: 12px; padding: 10px 20px; background: var(--emerald); color: #fff; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
        .refresh-hint { margin-top: 10px; font-size: 12px; color: var(--text-muted); text-align: center; flex-shrink: 0; }

        @media (max-width: 1100px) {
            body { padding: 12px; } header { gap: 14px; }
            .logo-bar img { max-height: 60px; max-width: 180px; }
            h1 { font-size: 24px; } .cup { font-size: 42px; }
            .winner-code { font-size: 32px; } .winner-percent { font-size: 28px; }
            .rank-row { grid-template-columns: 28px 54px 1fr 66px; padding: 6px 8px; min-height: 36px; }
            .rank-num { font-size: 15px; } .rank-code { font-size: 13px; }
            .rank-percent { font-size: 13px; } .rank-count { font-size: 9px; }
            .header-actions { gap: 8px; }
            .total-badge { font-size: 14px; padding: 6px 12px; }
            .reset-btn { font-size: 12px; padding: 6px 12px; }
        }
        @media (max-width: 760px) {
            body { overflow: auto; } header { flex-wrap: wrap; justify-content: center; }
            .title-block { order: -1; flex-basis: 100%; }
            .ranking { grid-template-columns: repeat(2, 1fr); }
            .winner-block { flex-wrap: wrap; gap: 12px; }
            .winner-percent { margin-left: 0; text-align: left; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-bar"><img src="logo.png" alt="Логотип"></div>
        <div class="title-block">
            <h1>Лучший проект конкурса «Профессионал управления имуществом»</h1>
            <div class="subtitle">Результаты голосования в зале</div>
        </div>
        <div class="header-actions">
            <div class="total-badge" id="totalBadge">Всего голосов: —</div>
            <button id="resetBtn" class="reset-btn" onclick="resetVotes()">Очистить</button>
        </div>
    </header>

    <div id="loading">Загрузка результатов…</div>
    <div id="content" style="display:none; flex-direction:column; flex:1; min-height:0;"></div>

    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

    <script>
        const CODES = [
            "U-01","U-02","U-03","U-04","U-05","U-06","U-07",
            "U-08","U-09","U-10","U-11","U-12","U-13",
            "U-14","U-15","U-16","U-17","U-18","U-19"
        ];

        // Твой конфиг Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyBvVhvb9apFU51DHdtYWPGR63ENMMluoBM",
            authDomain: "prof-uprav-vote.firebaseapp.com",
            projectId: "prof-uprav-vote",
            storageBucket: "prof-uprav-vote.firebasestorage.app",
            messagingSenderId: "263713733786",
            appId: "1:263713733786:web:ddfb8da85fec1d093a3323"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Обновление раз в 10 секунд
        const AUTO_REFRESH_MS = 10000;

        async function loadVotes() {
            const snapshot = await db.collection('votes').get();
            const result = {};
            CODES.forEach(c => result[c] = 0);
            snapshot.forEach(doc => {
                if (result.hasOwnProperty(doc.id)) {
                    result[doc.id] = doc.data().count || 0;
                }
            });
            return result;
        }

        function computeModel(votes) {
            const items = CODES.map(code => ({ code, count: Number(votes[code]) || 0 }));
            const total = items.reduce((s, i) => s + i.count, 0);
            items.forEach(i => { i.percent = total > 0 ? (i.count / total * 100) : 0; });
            items.sort((a, b) => {
                if (b.count !== a.count) return b.count - a.count;
                return a.code.localeCompare(b.code);
            });
            let winners = [];
            if (total > 0) {
                const maxCount = items[0].count;
                if (maxCount > 0) winners = items.filter(i => i.count === maxCount);
            }
            const winnerCodes = new Set(winners.map(w => w.code));
            const maxCount = winners.length > 0 ? winners[0].count : 0;
            const maxPercent = total > 0 ? (maxCount / total * 100) : 0;
            return { items, total, winners, winnerCodes, maxCount, maxPercent };
        }

        function buildHtml(model) {
            const { items, total, winners, winnerCodes, maxCount, maxPercent } = model;
            let html = '';
            html += `<div class="winner-block" id="winnerBlock">`;
            if (winners.length > 0) {
                const codesHtml = winners.map((w, idx) => {
                    const sep = idx < winners.length - 1 ? '<span class="plus">+</span>' : '';
                    return `<span class="winner-code">${w.code}${sep}</span>`;
                }).join('');
                const label = winners.length === 1 ? 'Победитель' : `Победители (${winners.length}) — равное число голосов`;
                html += `<div class="cup">🏆</div>
                    <div class="winner-info">
                        <div class="winner-label">${label}</div>
                        <div class="winner-codes">${codesHtml}</div>
                        <div class="winner-stats" id="winnerStats">${maxCount} голосов из ${total}</div>
                    </div>
                    <div class="winner-percent" id="winnerPercent">${maxPercent.toFixed(1)}%<small>${winners.length === 1 ? 'от всех голосов' : 'у каждого из лидеров'}</small></div>`;
            } else {
                html += `<div class="cup">🏆</div>
                    <div class="winner-info">
                        <div class="winner-label">Победитель</div>
                        <div class="winner-codes"><span class="winner-code">—</span></div>
                        <div class="winner-stats" id="winnerStats">Пока нет голосов</div>
                    </div>
                    <div class="winner-percent" id="winnerPercent">0.0%<small>от всех голосов</small></div>`;
            }
            html += `</div>`;

            html += '<div class="ranking" id="ranking">';
            items.forEach((item, idx) => {
                const rank = idx + 1;
                const isWinner = winnerCodes.has(item.code);
                const isTop3 = rank <= 3;
                const rowClass = isWinner ? 'rank-row winner-row' : isTop3 ? 'rank-row top3' : 'rank-row';
                html += `<div class="${rowClass}" data-code="${item.code}">
                    <div class="rank-num">${rank}</div>
                    <div class="rank-code">${item.code}</div>
                    <div class="rank-bar-wrap"><div class="rank-bar" style="width:0%"></div></div>
                    <div class="rank-values"><span class="rank-percent">0.0%</span><span class="rank-count">0 г.</span></div>
                </div>`;
            });
            html += '</div>';
            html += `<div class="refresh-hint">${AUTO_REFRESH_MS > 0 ? 'Данные обновляются автоматически каждые ' + (AUTO_REFRESH_MS / 1000) + ' с' : 'Обновите страницу (F5), чтобы увидеть свежие данные'}</div>`;
            return html;
        }

        function renderFull(votes) {
            const content = document.getElementById('content');
            document.getElementById('loading').style.display = 'none';
            content.style.display = 'flex';
            const model = computeModel(votes);
            content.innerHTML = buildHtml(model);
            updateNumbers(votes);
        }

        function updateNumbers(votes) {
            const model = computeModel(votes);
            const { items, total, winners, winnerCodes, maxCount, maxPercent } = model;

            document.getElementById('totalBadge').textContent = `Всего голосов: ${total}`;

            const wb = document.getElementById('winnerBlock');
            if (wb) {
                if (winners.length > 0) {
                    const codesHtml = winners.map((w, idx) => {
                        const sep = idx < winners.length - 1 ? '<span class="plus">+</span>' : '';
                        return `<span class="winner-code">${w.code}${sep}</span>`;
                    }).join('');
                    const label = winners.length === 1 ? 'Победитель' : `Победители (${winners.length}) — равное число голосов`;
                    const wl = wb.querySelector('.winner-label');
                    const wc = wb.querySelector('.winner-codes');
                    const ws = wb.querySelector('#winnerStats');
                    const wp = wb.querySelector('#winnerPercent');
                    if (wl) wl.textContent = label;
                    if (wc) wc.innerHTML = codesHtml;
                    if (ws) ws.textContent = `${maxCount} голосов из ${total}`;
                    if (wp) wp.innerHTML = `${maxPercent.toFixed(1)}%<small>${winners.length === 1 ? 'от всех голосов' : 'у каждого из лидеров'}</small>`;
                } else {
                    const ws = wb.querySelector('#winnerStats');
                    const wp = wb.querySelector('#winnerPercent');
                    const wc = wb.querySelector('.winner-codes');
                    if (wc) wc.innerHTML = `<span class="winner-code">—</span>`;
                    if (ws) ws.textContent = 'Пока нет голосов';
                    if (wp) wp.innerHTML = `0.0%<small>от всех голосов</small>`;
                }
            }

            const ranking = document.getElementById('ranking');
            if (!ranking) return;

            const orderChanged = (() => {
                const current = Array.from(ranking.children).map(el => el.dataset.code);
                return current.join(',') !== items.map(i => i.code).join(',');
            })();

            if (orderChanged) {
                ranking.innerHTML = items.map((item, idx) => {
                    const rank = idx + 1;
                    const isWinner = winnerCodes.has(item.code);
                    const isTop3 = rank <= 3;
                    const rowClass = isWinner ? 'rank-row winner-row' : isTop3 ? 'rank-row top3' : 'rank-row';
                    return `<div class="${rowClass}" data-code="${item.code}">
                        <div class="rank-num">${rank}</div>
                        <div class="rank-code">${item.code}</div>
                        <div class="rank-bar-wrap"><div class="rank-bar" style="width:0%"></div></div>
                        <div class="rank-values"><span class="rank-percent">0.0%</span><span class="rank-count">0 г.</span></div>
                    </div>`;
                }).join('');
            }

            items.forEach((item, idx) => {
                const row = ranking.querySelector(`[data-code="${item.code}"]`);
                if (!row) return;
                const rankNum = row.querySelector('.rank-num');
                const bar = row.querySelector('.rank-bar');
                const percentEl = row.querySelector('.rank-percent');
                const countEl = row.querySelector('.rank-count');
                if (rankNum) rankNum.textContent = idx + 1;
                if (bar) bar.style.width = item.percent.toFixed(2) + '%';
                if (percentEl) percentEl.textContent = item.percent.toFixed(1) + '%';
                if (countEl) countEl.textContent = item.count + ' г.';
            });
        }

        let isRefreshing = false;

        async function refresh(isFirst) {
            if (isRefreshing) return;
            isRefreshing = true;
            try {
                const votes = await loadVotes();
                if (isFirst) renderFull(votes);
                else updateNumbers(votes);
            } catch (e) {
                console.error(e);
                if (isFirst) {
                    const content = document.getElementById('content');
                    document.getElementById('loading').style.display = 'none';
                    content.style.display = 'flex';
                    content.innerHTML = `<div class="error-box">Не удалось загрузить данные.<br><button onclick="location.reload()">Повторить</button></div>`;
                }
            } finally {
                isRefreshing = false;
            }
        }

        // Очистка результатов с защитой паролем
        window.resetVotes = async function() {
            // Запрос пароля
            const password = prompt('Введите пароль для очистки результатов:');
            if (password === null) return; // Пользователь нажал "Отмена"
            
            // Пароль для очистки (можешь поменять здесь)
            if (password !== 'admin2026') {
                alert('Неверный пароль.');
                return;
            }

            if (!confirm('Вы уверены, что хотите обнулить все результаты голосования? Это действие нельзя отменить.')) {
                return;
            }

            const btn = document.getElementById('resetBtn');
            btn.disabled = true;
            btn.textContent = 'Очистка…';

            try {
                const batch = db.batch();
                CODES.forEach(code => {
                    const ref = db.collection('votes').doc(code);
                    batch.set(ref, { count: 0 }, { merge: true });
                });
                await batch.commit();

                const emptyVotes = {};
                CODES.forEach(c => emptyVotes[c] = 0);
                updateNumbers(emptyVotes);

                alert('Результаты успешно очищены.');
            } catch (e) {
                console.error(e);
                alert('Не удалось очистить результаты: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Очистить';
            }
        };

        // Запуск
        refresh(true);
        if (AUTO_REFRESH_MS > 0) setInterval(() => refresh(false), AUTO_REFRESH_MS);
    </script>
</body>
</html>
