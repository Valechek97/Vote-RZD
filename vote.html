<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Голосование — Лучший доклад (тест)</title>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            margin: 0;
            padding: 16px;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #ffffff;
            color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        .header {
            width: 100%;
            max-width: 400px;
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 3px solid #CD202C;
        }
        .header h1 {
            font-size: 20px;
            margin: 0 0 4px 0;
            color: #CD202C;
            font-weight: 700;
        }
        .header p {
            font-size: 13px;
            margin: 0;
            color: #394A58;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
        }
        .col {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .vote-btn {
            background: #f4f4f4;
            border: 2px solid #D3D3D3;
            border-radius: 10px;
            padding: 14px 0;
            font-size: 16px;
            font-weight: 600;
            color: #000;
            cursor: pointer;
            transition: all 0.15s;
            text-align: center;
            font-family: inherit;
            width: 100%;
            user-select: none;
        }
        .vote-btn:active { background: #e0e0e0; }
        .vote-btn.selected {
            background: #CD202C;
            border-color: #CD202C;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(205, 32, 44, 0.4);
        }
        .submit-area {
            width: 100%;
            max-width: 400px;
            position: sticky;
            bottom: 16px;
            background: #fff;
            padding-top: 10px;
        }
        #submitBtn {
            width: 100%;
            padding: 16px;
            background: #CD202C;
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            font-family: inherit;
        }
        #submitBtn:disabled {
            background: #BFC5CE;
            color: #fff;
            cursor: not-allowed;
        }
        #submitBtn:not(:disabled):active {
            background: #a01822;
        }
        .footer-note {
            margin-top: 12px;
            font-size: 11px;
            color: #828282;
            text-align: center;
            max-width: 400px;
        }
        .test-banner {
            width: 100%;
            max-width: 400px;
            background: #fff0f1;
            border: 2px dashed #CD202C;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: #CD202C;
            text-align: center;
            margin-bottom: 12px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="test-banner">🧪 ТЕСТОВЫЙ РЕЖИМ — ограничение повторного голосования отключено</div>

    <div class="header">
        <h1>Лучший доклад</h1>
        <p>Выберите один шифр и нажмите кнопку</p>
    </div>

    <div class="grid-container">
        <div class="col" id="col1"></div>
        <div class="col" id="col2"></div>
        <div class="col" id="col3"></div>
    </div>

    <div class="submit-area">
        <button id="submitBtn" disabled onclick="submitVote()">Проголосовать</button>
    </div>
    <div class="footer-note">Тестовый режим: один и тот же пользователь может голосовать многократно.</div>

    <script>
        const CODES = [
            "U-01","U-02","U-03","U-04","U-05","U-06","U-07",
            "U-08","U-09","U-10","U-11","U-12","U-13",
            "U-14","U-15","U-16","U-17","U-18","U-19"
        ];

        const NAMESPACE = "rjd-conf-2026-best-report-v2";
        // VOTED_KEY намеренно не используется в тестовом режиме

        let selectedCode = null;

        const col1 = document.getElementById('col1');
        const col2 = document.getElementById('col2');
        const col3 = document.getElementById('col3');

        CODES.forEach((code, index) => {
            const btn = document.createElement('button');
            btn.className = 'vote-btn';
            btn.textContent = code;
            btn.onclick = function() { selectVote(code, this); };
            if (index < 7) col1.appendChild(btn);
            else if (index < 13) col2.appendChild(btn);
            else col3.appendChild(btn);
        });

        window.selectVote = function(code, btn) {
            selectedCode = code;
            document.querySelectorAll('.vote-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            document.getElementById('submitBtn').disabled = false;
        };

        window.submitVote = async function() {
            if (!selectedCode) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Отправка…';

            try {
                const url = `https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${encodeURIComponent(selectedCode)}?_=${Date.now()}`;
                const res = await fetch(url);
                if (!res.ok) throw new Error('HTTP ' + res.status);

                // Тестовый режим: НЕ записываем в localStorage, показываем подтверждение
                document.body.innerHTML = `
                    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;text-align:center;padding:20px;">
                        <div style="font-size:72px;color:#CD202C;line-height:1;">✓</div>
                        <h2 style="color:#CD202C;margin:16px 0 8px;">Голос принят (тест)</h2>
                        <p style="color:#394A58;font-size:16px;">Ваш голос за <strong>${selectedCode}</strong> записан.</p>
                        <button onclick="location.reload()" style="margin-top:24px;padding:12px 24px;background:#CD202C;color:#fff;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;">
                            Проголосовать ещё раз
                        </button>
                    </div>
                `;
            } catch (e) {
                console.error(e);
                alert('Не удалось отправить голос: ' + e.message + '\n\nПроверьте интернет или подождите 10 секунд (лимит запросов Abacus).');
                btn.disabled = false;
                btn.textContent = 'Проголосовать';
            }
        };
    </script>
</body>
</html>
